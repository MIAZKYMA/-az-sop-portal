<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ Global – SOP Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0F1D33;
  --navy-800:#12233F;
  --navy-700:#1B3358;
  --navy-600:#28466F;
  --steel-50:#F3F5F8;
  --steel-100:#EEF1F5;
  --steel-200:#E3E8EE;
  --line:#DCE1E8;
  --white:#FFFFFF;
  --ink:#16202C;
  --muted:#5B6675;
  --muted-2:#8590A0;
  --amber:#DD8A1E;
  --amber-dark:#B96A12;
  --amber-soft:#FBEBD3;
  --green:#1E8A5F;
  --green-soft:#E0F2E9;
  --gold:#B8860B;
  --gold-soft:#FBF0DA;
  --grey-status:#6B7280;
  --grey-soft:#EAECEF;
  --danger:#C0392B;
  --radius-s:4px;
  --radius-m:6px;
  --radius-l:10px;
  --sidebar-w:248px;
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',Consolas,Monaco,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--steel-100);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
  line-height:1.55;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--amber-soft);}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

/* ---------- App Shell ---------- */
#app-shell{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:var(--sidebar-w);
  background:var(--navy-800);
  color:#CBD5E3;
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:40;
  transition:transform .2s ease;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 18px 16px 18px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand-mark{
  width:36px;height:36px;border-radius:var(--radius-s);
  background:linear-gradient(155deg,var(--amber),var(--amber-dark));
  color:var(--navy-900);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;letter-spacing:0.02em;
  flex-shrink:0;
  font-family:var(--font-mono);
}
.brand-text{line-height:1.25;}
.brand-text .b1{color:#fff;font-weight:600;font-size:14.5px;letter-spacing:0.01em;}
.brand-text .b2{color:#93A2B8;font-size:11.5px;margin-top:1px;}

.side-nav{padding:14px 10px;flex:1;overflow-y:auto;}
.side-section-label{
  padding:14px 10px 6px 10px;
  font-size:11px;color:#6E80A0;
  letter-spacing:0.04em;
}
.side-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--radius-s);
  color:#B9C6D9;font-size:13.6px;font-weight:500;
  margin-bottom:2px;
}
.side-link:hover{background:rgba(255,255,255,0.06);color:#fff;}
.side-link.active{background:var(--navy-700);color:#fff;box-shadow:inset 2px 0 0 var(--amber);}
.side-link .ic{width:17px;height:17px;flex-shrink:0;opacity:.9;}
.side-link .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:#7C8CA5;}

.dept-mini-list{padding:2px 10px 10px 10px;}
.dept-mini-link{
  display:flex;align-items:center;gap:9px;
  padding:6.5px 12px;border-radius:var(--radius-s);
  color:#A7B4C7;font-size:13px;
}
.dept-mini-link:hover{background:rgba(255,255,255,0.06);color:#fff;}
.dept-mini-link.active{background:var(--navy-700);color:#fff;}
.dept-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

.sidebar-foot{
  padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);
  font-size:11.5px;color:#66759090;
}

/* Main column */
#main-col{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;}

/* Topbar */
#topbar{
  position:sticky;top:0;z-index:30;
  background:var(--white);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:12px 24px;
}
#hamburger{display:none;background:none;border:none;padding:6px;color:var(--ink);}
.search-wrap{flex:1;max-width:520px;position:relative;}
.search-wrap input{
  width:100%;padding:9px 14px 9px 36px;
  border:1px solid var(--line);border-radius:var(--radius-m);
  background:var(--steel-50);font-size:13.6px;color:var(--ink);
}
.search-wrap input:focus{background:#fff;border-color:var(--navy-600);}
.search-wrap .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2);width:15px;height:15px;}
.topbar-spacer{flex:1;}
.role-switch{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:var(--radius-m);
  padding:6px 10px;font-size:12.8px;color:var(--muted);background:var(--steel-50);
}
.role-switch select{border:none;background:transparent;font-size:12.8px;color:var(--ink);font-weight:600;}
.icon-btn{
  position:relative;width:34px;height:34px;border-radius:var(--radius-m);
  border:1px solid var(--line);background:var(--white);
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.icon-btn:hover{background:var(--steel-50);}
.icon-btn .dot{
  position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--amber);border:2px solid #fff;
}
.notif-panel{
  position:absolute;right:24px;top:58px;width:340px;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);
  box-shadow:0 10px 30px rgba(15,29,51,0.14);
  z-index:50;overflow:hidden;
}
.notif-panel h4{margin:0;padding:13px 16px;font-size:13px;border-bottom:1px solid var(--line);color:var(--ink);}
.notif-item{padding:11px 16px;border-bottom:1px solid var(--steel-100);font-size:12.8px;}
.notif-item:last-child{border-bottom:none;}
.notif-item .t{font-weight:600;color:var(--ink);}
.notif-item .d{color:var(--muted);margin-top:2px;font-size:12px;}

/* Content area */
#view{padding:22px 26px 60px 26px;max-width:1280px;width:100%;margin:0 auto;}

.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.6px;color:var(--muted);margin-bottom:14px;}
.breadcrumb a:hover{color:var(--navy-700);text-decoration:underline;}
.breadcrumb .sep{color:var(--muted-2);}
.breadcrumb .cur{color:var(--ink);font-weight:600;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:600;color:var(--navy-900);letter-spacing:-0.01em;}
.page-sub{color:var(--muted);font-size:13.4px;margin-top:3px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:var(--radius-m);padding:8px 14px;font-size:13.2px;font-weight:600;
  border:1px solid transparent;white-space:nowrap;
}
.btn-primary{background:var(--navy-800);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-amber{background:var(--amber);color:#3A2200;}
.btn-amber:hover{background:var(--amber-dark);color:#fff;}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{background:var(--steel-50);}
.btn-danger-ghost{background:#fff;border-color:#EBCFC9;color:var(--danger);}
.btn-danger-ghost:hover{background:#FBEEEC;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* Stats strip */
.stats-strip{
  display:grid;grid-template-columns:repeat(5,1fr);
  border:1px solid var(--line);border-radius:var(--radius-l);
  background:#fff;overflow:hidden;margin-bottom:22px;
}
.stat-cell{padding:14px 18px;border-right:1px solid var(--line);}
.stat-cell:last-child{border-right:none;}
.stat-num{font-family:var(--font-mono);font-size:21px;font-weight:600;color:var(--navy-900);}
.stat-lbl{font-size:11.6px;color:var(--muted);margin-top:2px;}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px 0;}
.section-head h3{font-size:15.5px;font-weight:600;color:var(--navy-900);margin:0;}
.section-head a.view-all{font-size:12.6px;color:var(--navy-700);font-weight:600;}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;}
.dept-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);
  padding:16px;position:relative;overflow:hidden;
}
.dept-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dcolor,var(--navy-600));}
.dept-card-top{display:flex;gap:11px;align-items:flex-start;}
.mono-badge{
  width:38px;height:38px;border-radius:var(--radius-s);flex-shrink:0;
  background:var(--dcolor,var(--navy-700));color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:600;font-size:13px;
}
.dept-card h4{margin:0;font-size:14.5px;font-weight:600;color:var(--ink);}
.dept-card .desc{color:var(--muted);font-size:12.6px;margin-top:5px;line-height:1.5;min-height:32px;}
.dept-card .meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--steel-100);}
.dept-card .count-badge{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:var(--steel-100);padding:3px 8px;border-radius:20px;}

/* Lists (recent/most-used) */
.mini-list{display:flex;flex-direction:column;gap:8px;}
.mini-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;
}
.mini-row .mchip{width:6px;height:30px;border-radius:3px;background:var(--dcolor,var(--navy-600));flex-shrink:0;}
.mini-row .mbody{flex:1;min-width:0;}
.mini-row .mtitle{font-size:13.4px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-row .mmeta{font-size:11.6px;color:var(--muted);margin-top:2px;font-family:var(--font-mono);}
.mini-row .mright{font-size:11.6px;color:var(--muted-2);text-align:right;flex-shrink:0;}
.fav-star{background:none;border:none;color:var(--muted-2);padding:4px;flex-shrink:0;}
.fav-star.active{color:var(--amber);}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.quick-tile{
  border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;
  padding:13px 14px;display:flex;flex-direction:column;gap:8px;
}
.quick-tile .qlabel{font-size:12.8px;font-weight:600;color:var(--ink);}
.quick-tile .qsub{font-size:11.4px;color:var(--muted);}

/* Status pills */
.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11.3px;font-weight:600;
  font-family:var(--font-mono);
}
.status-active{background:var(--green-soft);color:var(--green);}
.status-draft{background:var(--gold-soft);color:var(--gold);}
.status-archived{background:var(--grey-soft);color:var(--grey-status);}
.dotpip{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* Category tabs */
.cat-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.cat-tab{
  padding:6.5px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12.6px;font-weight:600;color:var(--muted);
}
.cat-tab.active{background:var(--navy-800);border-color:var(--navy-800);color:#fff;}

/* SOP document cards (department page list) */
.sop-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.sop-doc-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.sop-doc-card .sdc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.sop-doc-card .sdc-code{font-family:var(--font-mono);font-size:11.3px;color:var(--muted-2);}
.sop-doc-card h4{margin:0;font-size:14.3px;font-weight:600;color:var(--ink);line-height:1.35;}
.sdc-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11.8px;color:var(--muted);padding-top:8px;border-top:1px solid var(--steel-100);}
.sdc-facts b{color:var(--ink);font-weight:600;}
.sdc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}

/* SOP detail page */
.sop-header{
  background:linear-gradient(180deg,var(--navy-800),var(--navy-900));
  color:#fff;border-radius:var(--radius-l);padding:22px 26px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.sop-header::after{
  content:"";position:absolute;inset:0;opacity:.10;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:26px 26px;pointer-events:none;
}
.sop-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;}
.sop-header .code-line{font-family:var(--font-mono);font-size:12px;color:#9FB2CC;letter-spacing:0.02em;}
.sop-header h1{font-size:22px;font-weight:600;margin:6px 0 0 0;letter-spacing:-0.01em;max-width:640px;}
.sop-header-actions{display:flex;gap:8px;flex-shrink:0;}
.sop-meta-grid{
  position:relative;
  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px;
  padding-top:16px;border-top:1px solid rgba(255,255,255,0.14);
}
.sop-meta-grid .mk{font-size:10.8px;color:#8FA2BE;margin-bottom:3px;}
.sop-meta-grid .mv{font-size:13px;font-weight:600;color:#fff;font-family:var(--font-mono);}

.doc-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
.doc-main{display:flex;flex-direction:column;gap:18px;}
.doc-section{background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);padding:20px 22px;}
.doc-section h3{font-size:13.5px;text-transform:none;font-weight:700;color:var(--navy-900);margin:0 0 12px 0;display:flex;align-items:center;gap:8px;}
.doc-section h3 .num{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);}
.doc-section p{margin:0;color:var(--ink);font-size:13.6px;line-height:1.65;}
.step-list{list-style:none;margin:0;padding:0;counter-reset:step;display:flex;flex-direction:column;gap:0;}
.step-list li{
  counter-increment:step;position:relative;padding:11px 0 11px 40px;
  border-bottom:1px solid var(--steel-100);font-size:13.4px;
}
.step-list li:last-child{border-bottom:none;}
.step-list li::before{
  content:counter(step);position:absolute;left:0;top:9px;
  width:26px;height:26px;border-radius:50%;background:var(--navy-800);color:#fff;
  font-family:var(--font-mono);font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.resp-table{width:100%;border-collapse:collapse;font-size:13.2px;}
.resp-table td{padding:8px 4px;border-bottom:1px solid var(--steel-100);vertical-align:top;}
.resp-table td:first-child{color:var(--navy-700);font-weight:600;width:170px;white-space:nowrap;}
.resp-table tr:last-child td{border-bottom:none;}
.doc-chip-list{display:flex;flex-direction:column;gap:8px;}
.doc-chip{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border:1px solid var(--line);border-radius:var(--radius-m);font-size:13px;
}
.doc-chip .ic{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.flow-track{display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.flow-node{
  border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 14px;background:var(--steel-50);
  font-size:12.6px;min-width:150px;
}
.flow-node .fs{font-weight:700;color:var(--navy-900);font-size:12.8px;}
.flow-node .fa{color:var(--muted);margin-top:2px;}
.flow-arrow{padding:0 10px;color:var(--muted-2);font-size:16px;}
.related-list{display:flex;flex-direction:column;gap:8px;}
.related-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-m);font-size:12.8px;
}
.related-item .rt{font-weight:600;color:var(--ink);}
.related-item .rc{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);}
.vh-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.vh-table th{text-align:left;color:var(--muted);font-weight:600;font-size:11.3px;padding:6px 8px;border-bottom:2px solid var(--steel-200);}
.vh-table td{padding:9px 8px;border-bottom:1px solid var(--steel-100);}
.vh-table td.vnum{font-family:var(--font-mono);font-weight:600;color:var(--navy-800);}

.doc-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px;}
.side-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);padding:16px;}
.side-card h4{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 10px 0;}

/* Forms (admin) */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12.4px;font-weight:600;color:var(--ink);}
.form-field .hint{font-size:11px;color:var(--muted-2);}
.form-field input,.form-field select,.form-field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-m);font-size:13.2px;background:#fff;color:var(--ink);
}
.form-field textarea{resize:vertical;min-height:70px;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--navy-600);}
.list-editor{display:flex;flex-direction:column;gap:8px;}
.list-editor-row{display:flex;gap:8px;align-items:center;}
.list-editor-row input{flex:1;}
.remove-row-btn{background:#fff;border:1px solid var(--line);border-radius:var(--radius-s);color:var(--danger);width:30px;height:32px;flex-shrink:0;}
.add-row-btn{align-self:flex-start;font-size:12.2px;font-weight:600;color:var(--navy-700);background:none;border:none;padding:4px 0;}

.admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.admin-tab{padding:10px 16px;font-size:13.2px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.admin-tab.active{color:var(--navy-900);border-bottom-color:var(--amber);}

.admin-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden;font-size:13px;}
.admin-table th{text-align:left;background:var(--steel-50);color:var(--muted);font-weight:600;font-size:11.4px;padding:10px 14px;border-bottom:1px solid var(--line);}
.admin-table td{padding:10px 14px;border-bottom:1px solid var(--steel-100);vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.icon-mini-btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);}
.icon-mini-btn:hover{background:var(--steel-50);}
.icon-mini-btn.danger{color:var(--danger);}
.icon-mini-btn.danger:hover{background:#FBEEEC;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-l);background:#fff;
}
.empty-state .es-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:5px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(15,29,51,0.45);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
}
.modal-box{background:#fff;border-radius:var(--radius-l);max-width:760px;width:100%;padding:24px;}
.modal-box h3{margin:0 0 18px 0;font-size:16.5px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}

.filters-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.filters-bar select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-m);font-size:12.6px;background:#fff;color:var(--ink);}
.result-count{font-size:12.6px;color:var(--muted);margin-left:auto;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--navy-900);color:#fff;
  padding:11px 18px;border-radius:var(--radius-m);font-size:13px;z-index:200;
  box-shadow:0 8px 22px rgba(0,0,0,0.25);
  display:flex;align-items:center;gap:8px;
}

@media (max-width: 980px){
  .doc-layout{grid-template-columns:1fr;}
  .doc-side{position:static;}
  .sop-meta-grid{grid-template-columns:repeat(2,1fr);}
  .stats-strip{grid-template-columns:repeat(2,1fr);}
  .stat-cell:nth-child(2n){border-right:none;}
  .form-grid{grid-template-columns:1fr;}
}
@media (max-width: 780px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);box-shadow:8px 0 30px rgba(0,0,0,0.25);}
  #main-col{margin-left:0;}
  #hamburger{display:flex;align-items:center;justify-content:center;}
  .role-switch span{display:none;}
}

/* ---------- RTL / Arabic language mode ---------- */
html[dir="rtl"] body{font-family:'IBM Plex Sans Arabic',var(--font-ui);}
html[dir="rtl"] .side-link.active{box-shadow:inset -2px 0 0 var(--amber);}
html[dir="rtl"] #sidebar{left:auto;right:0;}
html[dir="rtl"] #main-col{margin-left:0;margin-right:var(--sidebar-w);}
html[dir="rtl"] .search-wrap .sic{left:auto;right:11px;}
html[dir="rtl"] .search-wrap input{padding:9px 36px 9px 14px;}
html[dir="rtl"] .icon-btn .dot{right:auto;left:-3px;}
html[dir="rtl"] .notif-panel{right:auto;left:24px;}
html[dir="rtl"] .dept-card::before{left:auto;right:0;}
html[dir="rtl"] .mini-row .mright{text-align:left;}
html[dir="rtl"] .step-list li{padding:11px 40px 11px 0;}
html[dir="rtl"] .step-list li::before{left:auto;right:0;}
html[dir="rtl"] .resp-table td:first-child{white-space:normal;}
html[dir="rtl"] .flow-arrow{transform:scaleX(-1);}
html[dir="rtl"] .breadcrumb .chev{display:inline-block;transform:scaleX(-1);}
html[dir="rtl"] .stat-cell{border-right:none;border-left:1px solid var(--line);}
html[dir="rtl"] .stat-cell:last-child{border-left:none;}
html[dir="rtl"] .sop-header,html[dir="rtl"] .sop-meta-grid{text-align:right;}
html[dir="rtl"] .row-actions{justify-content:flex-start;}
html[dir="rtl"] .vh-table th,html[dir="rtl"] .vh-table td{text-align:right;}
html[dir="rtl"] .lang-switch{font-family:var(--font-ui);}
@media (max-width:780px){
  html[dir="rtl"] #sidebar{transform:translateX(100%);}
  html[dir="rtl"] #sidebar.open{transform:translateX(0);}
  html[dir="rtl"] #main-col{margin-right:0;}
}
.lang-switch{
  display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;flex-shrink:0;
}
.lang-switch button{
  border:none;background:#fff;color:var(--muted);font-size:12px;font-weight:700;padding:7px 11px;
}
.lang-switch button.active{background:var(--navy-800);color:#fff;}
</style>

/* ---------------------------- STATE ---------------------------- */
let DEPARTMENTS = JSON.parse(JSON.stringify(DEPARTMENTS_DEFAULT));
let SOPS = JSON.parse(JSON.stringify(SOPS_DEFAULT));
let LANG = "en";
let ROLE = "admin"; // admin | manager | employee (demo switcher)
let FAVORITES = [];
let VIEW_COUNTS = {};
let STORAGE_OK = true;
let notifOpen = false;
let sidebarOpen = false;

function t(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key; }
function tf(field){ if(!field) return ""; return field[LANG] || field.en || ""; }
function dir(){ return LANG === "ar" ? "rtl" : "ltr"; }

/* ---------------------------- PERSISTENCE ---------------------------- */
async function safeGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function safeSet(key, value, shared){
  try{ const r = await window.storage.set(key, value, !!shared); return !!r; }
  catch(e){ return false; }
}

async function loadAll(){
  try{
    const lang = await safeGet("az-sop-lang", false);
    if(lang === "en" || lang === "ar") LANG = lang;
    const role = await safeGet("az-sop-role", false);
    if(role) ROLE = role;
    const favs = await safeGet("az-sop-favorites", false);
    if(favs){ try{ FAVORITES = JSON.parse(favs); }catch(e){} }
    const vc = await safeGet("az-sop-viewcounts", false);
    if(vc){ try{ VIEW_COUNTS = JSON.parse(vc); }catch(e){} }
    const data = await safeGet("az-sop-appdata", true);
    if(data){
      try{
        const parsed = JSON.parse(data);
        if(parsed.departments) DEPARTMENTS = parsed.departments;
        if(parsed.sops) SOPS = parsed.sops;
      }catch(e){}
    }
  }catch(e){ STORAGE_OK = false; }
}

async function persistData(showToast){
  const ok = await safeSet("az-sop-appdata", JSON.stringify({departments:DEPARTMENTS, sops:SOPS}), true);
  if(showToast) toast(ok ? t("saved") : t("errorSaving"), ok);
  return ok;
}
async function persistFavorites(){ await safeSet("az-sop-favorites", JSON.stringify(FAVORITES), false); }
async function persistViewCounts(){ await safeSet("az-sop-viewcounts", JSON.stringify(VIEW_COUNTS), false); }
async function persistLang(){ await safeSet("az-sop-lang", LANG, false); }
async function persistRole(){ await safeSet("az-sop-role", ROLE, false); }

/* ---------------------------- UTILS ---------------------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getDept(id){ return DEPARTMENTS.find(d=>d.id===id); }
function getSop(id){ return SOPS.find(s=>s.id===id); }
function getCat(dept, catId){ return dept ? dept.categories.find(c=>c.id===catId) : null; }
function sopsForDept(deptId){ return SOPS.filter(s=>s.dept===deptId); }
function formatDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  const locale = LANG==="ar" ? "ar-EG" : "en-GB";
  return d.toLocaleDateString(locale, {year:"numeric",month:"short",day:"2-digit"});
}
function statusPill(status){
  const map = {active:"statusActive",draft:"statusDraft",archived:"statusArchived"};
  return `<span class="status-pill status-${status}"><span class="dotpip"></span>${t(map[status]||"statusActive")}</span>`;
}
function monoBadge(dept){ return `<div class="mono-badge" style="--dcolor:${dept.color}">${esc(dept.mono)}</div>`; }
function viewCountOf(sopId){ return VIEW_COUNTS[sopId] || Math.floor(20 + (sopId.charCodeAt(4)||50)); }
function isFav(sopId){ return FAVORITES.includes(sopId); }

function toast(msg, ok){
  const root = document.getElementById("toast-root");
  const div = document.createElement("div");
  div.className = "toast";
  div.innerHTML = `<span>${ok===false?"⚠":"✓"}</span><span>${esc(msg)}</span>`;
  root.appendChild(div);
  setTimeout(()=>{ div.style.transition="opacity .3s"; div.style.opacity="0"; setTimeout(()=>div.remove(),300); }, 2400);
}

function searchIndex(q){
  q = (q||"").trim().toLowerCase();
  if(!q) return [];
  return SOPS.filter(s=>{
    const dept = getDept(s.dept);
    const cat = getCat(dept, s.category);
    const hay = [
      tf(s.title), s.code, dept?tf(dept.name):"", cat?tf(cat.name):"",
      (s.keywords||[]).join(" "), tf(s.purpose), tf(s.scope)
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

function computeStats(){
  return {
    total: SOPS.length,
    depts: DEPARTMENTS.length,
    active: SOPS.filter(s=>s.status==="active").length,
    draft: SOPS.filter(s=>s.status==="draft").length,
    archived: SOPS.filter(s=>s.status==="archived").length
  };
}
function recentlyAdded(n){ return [...SOPS].sort((a,b)=> new Date(b.effectiveDate)-new Date(a.effectiveDate)).slice(0,n||5); }
function recentlyUpdatedList(n){ return [...SOPS].sort((a,b)=> new Date(b.lastUpdated)-new Date(a.lastUpdated)).slice(0,n||5); }
function mostUsed(n){ return [...SOPS].sort((a,b)=> viewCountOf(b.id)-viewCountOf(a.id)).slice(0,n||5); }


/* ---------------------------- ROUTER ---------------------------- */
function parseRoute(){
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);
  return parts;
}
function go(path){ location.hash = "#/" + path; }

function route(){
  const parts = parseRoute();
  sidebarOpen = false;
  document.getElementById("sidebar").classList.remove("open");
  if(parts.length === 0 || parts[0] === "dashboard") return renderDashboard();
  if(parts[0] === "department" && parts[1]) return renderDepartmentPage(parts[1], parts[2]);
  if(parts[0] === "sop" && parts[1]) return renderSopDetail(parts[1]);
  if(parts[0] === "all-sops") return renderAllSops();
  if(parts[0] === "recent") return renderRecentPage();
  if(parts[0] === "favorites") return renderFavoritesPage();
  if(parts[0] === "search") return renderSearchPage(decodeURIComponent(parts[1]||""));
  if(parts[0] === "admin") return renderAdmin(parts[1]||"departments");
  return renderDashboard();
}
window.addEventListener("hashchange", route);

function toggleSidebar(){
  sidebarOpen = !sidebarOpen;
  document.getElementById("sidebar").classList.toggle("open", sidebarOpen);
}

function toggleNotif(ev){
  ev.stopPropagation();
  notifOpen = !notifOpen;
  renderNotifPanel();
}
function renderNotifPanel(){
  let panel = document.getElementById("notif-panel");
  if(panel) panel.remove();
  if(!notifOpen) return;
  const items = recentlyUpdatedList(6);
  const rows = items.length ? items.map(s=>{

function breadcrumb(items){
  const chev = LANG==='ar' ? '‹' : '›';
  const parts = items.map((it,i)=>{
    if(i===items.length-1) return `<span class="cur">${esc(it.label)}</span>`;
    return `<a href="${it.href}">${esc(it.label)}</a>`;
  });
  return `<div class="breadcrumb">` + parts.join(`<span class="sep chev">${chev}</span>`) + `</div>`;
}

}

async function moveDept(i, dir){
  const j = i+dir;
  if(j<0 || j>=DEPARTMENTS.length) return;
  const tmp = DEPARTMENTS[i]; DEPARTMENTS[i]=DEPARTMENTS[j]; DEPARTMENTS[j]=tmp;
  await persistData(true);
  renderAdmin("departments");
}
async function deleteDept(id){
  if(!confirm(t('confirmDelete'))) return;
  DEPARTMENTS = DEPARTMENTS.filter(d=>d.id!==id);
  SOPS = SOPS.filter(s=>s.dept!==id);
  await persistData(true);
  renderShell(); renderAdmin("departments");
}
async function deleteSop(id){
  if(!confirm(t('confirmDelete'))) return;
  SOPS = SOPS.filter(s=>s.id!==id);
  await persistData(true);
  renderShell(); renderAdmin("sops");
}
async function cycleStatus(id){
  const s = getSop(id); if(!s) return;
  const order = ["active","draft","archived"];
  s.status = order[(order.indexOf(s.status)+1)%order.length];
  await persistData(true);
  renderAdmin("sops");
}

/* ---------------------------- DEPARTMENT MODAL ---------------------------- */

          <div class="form-field"><label>${esc(t('nameAr'))}</label><input id="f-name-ar" type="text" value="${esc(d.name.ar)}" dir="rtl"></div>
          <div class="form-field full"><label>${esc(t('description'))} (EN)</label><textarea id="f-desc-en">${esc(d.desc.en)}</textarea></div>
          <div class="form-field full"><label>${esc(t('descAr'))}</label><textarea id="f-desc-ar" dir="rtl">${esc(d.desc.ar)}</textarea></div>
          <div class="form-field"><label>${esc(t('colorLabel'))}</label><input id="f-color" type="color" value="${d.color}" style="height:38px;"></div>
          <div class="form-field"><label>${esc(t('monoLabel'))}</label><input id="f-mono" type="text" maxlength="4" value="${esc(d.mono)}"></div>
          <div class="form-field full">
            <label>${esc(t('navDepartments'))} · ${esc(t('addCategory'))}</label>
            <div class="list-editor" id="cat-editor">${catsHtml}</div>
            <button class="add-row-btn" onclick="addCatRow()">+ ${esc(t('addCategory'))}</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">${esc(t('cancel'))}</button>
          <button class="btn btn-primary" onclick="saveDept('${editing?d.id:''}')">${esc(t('save'))}</button>
        </div>
      </div>
    </div>`;
  document.getElementById("overlay-root").innerHTML = html;
  modalOpenedAt = Date.now();
}
function addCatRow(){
  const wrap = document.getElementById("cat-editor");
  const row = document.createElement("div");
  row.className = "list-editor-row"; row.setAttribute("data-cat-row","");
  row.innerHTML = `<input type="text" placeholder="${esc(t('name'))}" data-cat-en><input type="text" placeholder="${esc(t('nameAr'))}" data-cat-ar dir="rtl"><button class="remove-row-btn" onclick="this.closest('[data-cat-row]').remove()">✕</button>`;
  wrap.appendChild(row);
}
function closeModal(){ document.getElementById("overlay-root").innerHTML = ""; }
let modalOpenedAt = 0;
function handleOverlayClick(e, el){
  if(e.target !== el) return;
  if(Date.now() - modalOpenedAt < 400) return; // ignore mobile "ghost click" firing right after the tap that opened the modal
  closeModal();
}

async function saveDept(existingId){
  const nameEn = document.getElementById("f-name-en").value.trim();
  const nameAr = document.getElementById("f-name-ar").value.trim();
  if(!nameEn){ toast(t('fieldRequired'), false); return; }
  const rows = document.querySelectorAll("#cat-editor [data-cat-row]");
  const categories = Array.from(rows).map((r,i)=>{
    const en = r.querySelector("[data-cat-en]").value.trim();
    const ar = r.querySelector("[data-cat-ar]").value.trim();
    return en ? {id: (en.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24) || 'cat'+i), name:{en, ar: ar||en}} : null;
  }).filter(Boolean);

  const payload = {
    id: existingId || (nameEn.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24) || "dept"+Date.now()),
    color: document.getElementById("f-color").value,
    mono: (document.getElementById("f-mono").value || nameEn.slice(0,3)).toUpperCase(),
    name:{en:nameEn, ar: nameAr||nameEn},
    desc:{en:document.getElementById("f-desc-en").value.trim(), ar:document.getElementById("f-desc-ar").value.trim()},
    categories: categories.length ? categories : (existingId ? getDept(existingId).categories : [])
  };
  if(existingId){
    const idx = DEPARTMENTS.findIndex(d=>d.id===existingId);
    DEPARTMENTS[idx] = payload;
  } else {
    DEPARTMENTS.push(payload);
  }
  await persistData(false);
  closeModal();
  toast(existingId ? t('updated') : t('added'), true);
  renderShell(); renderAdmin("departments");
}

          <div class="form-field"><label>${esc(t('code'))}</label><input id="f-code" type="text" value="${esc(s.code)}"></div>
          <div class="form-field"><label>${esc(t('status'))}</label>
            <select id="f-status">

              <option value="draft" ${s.status==='draft'?'selected':''}>${esc(t('statusDraft'))}</option>
              <option value="archived" ${s.status==='archived'?'selected':''}>${esc(t('statusArchived'))}</option>

          <div class="form-field full"><label>${esc(t('titleField'))} (EN)</label><input id="f-title-en" type="text" value="${esc(s.title.en)}"></div>
          <div class="form-field full"><label>${esc(t('titleFieldAr'))}</label><input id="f-title-ar" type="text" value="${esc(s.title.ar)}" dir="rtl"></div>
          <div class="form-field"><label>${esc(t('department'))}</label><select id="f-dept" onchange="onSopDeptChange()">${deptOpts}</select></div>
          <div class="form-field"><label>${esc(t('category'))}</label><select id="f-cat">${catOptsFor(curDept)}</select></div>
          <div class="form-field"><label>${esc(t('version'))}</label><input id="f-version" type="text" value="${esc(s.version)}"></div>
          <div class="form-field"><label>${esc(t('responsiblePerson'))}</label><input id="f-resp" type="text" value="${esc(s.responsiblePerson)}"></div>
          <div class="form-field"><label>${esc(t('effectiveDate'))}</label><input id="f-eff" type="date" value="${esc(s.effectiveDate)}"></div>

          <div class="form-field full"><label>${esc(t('purpose'))} (EN)</label><textarea id="f-purpose-en">${esc(s.purpose.en)}</textarea></div>
          <div class="form-field full"><label>${esc(t('purposeAr'))}</label><textarea id="f-purpose-ar" dir="rtl">${esc(s.purpose.ar)}</textarea></div>
          <div class="form-field full"><label>${esc(t('scope'))} (EN)</label><textarea id="f-scope-en">${esc(s.scope.en)}</textarea></div>
          <div class="form-field full"><label>${esc(t('scopeAr'))}</label><textarea id="f-scope-ar" dir="rtl">${esc(s.scope.ar)}</textarea></div>

          <div class="form-field full"><label>${esc(t('requiredDocs'))} <span class="hint">(${esc(t('stepsHint'))})</span></label><textarea id="f-docs">${esc((s.requiredDocs||[]).join("\n"))}</textarea></div>

            <button class="add-row-btn" onclick="addFormRow()">+ ${esc(t('addRow'))}</button>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">${esc(t('cancel'))}</button>

function onSopDeptChange(){
  const deptId = document.getElementById("f-dept").value;
  const dept = getDept(deptId);
  document.getElementById("f-cat").innerHTML = dept.categories.map(c=>`<option value="${c.id}">${esc(tf(c.name))}</option>`).join("");
}

/* ---- Related Forms / PDF attachment rows ---- */
function attachmentRow(f, i){
  f = f || {name:"", type:"Form", dataUrl:""};
  return `<div class="list-editor-row" data-form-row style="align-items:flex-start;flex-wrap:wrap;">
    <input type="text" value="${esc(f.name)}" placeholder="${esc(t('name'))}" data-form-name style="flex:1 1 200px;">
    <select data-form-type style="padding:9px 8px;border:1px solid var(--line);border-radius:var(--radius-m);">
      <option value="Form" ${f.type==='Form'?'selected':''}>${esc(t('form'))}</option>
      <option value="Document" ${f.type==='Document'?'selected':''}>${esc(t('document'))}</option>
    </select>
    <input type="file" accept="application/pdf" data-form-file style="flex:1 1 180px;font-size:12px;">
    <input type="hidden" data-form-dataurl value="${f.dataUrl?esc(f.dataUrl):''}">
    <span data-form-filenote style="font-size:11px;color:var(--muted-2);flex:1 1 100%;">${f.dataUrl ? esc(t('attachExisting'))+': '+esc(f.name||'file')+'.pdf' : esc(t('noFile'))}</span>
    <button class="remove-row-btn" onclick="this.closest('[data-form-row]').remove()">✕</button>
  </div>`;
}
function addFormRow(){
  const wrap = document.getElementById("forms-editor");
  const div = document.createElement("div");
  div.innerHTML = attachmentRow(null, wrap.children.length);
  wrap.appendChild(div.firstElementChild);
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function collectAttachments(){
  const rows = document.querySelectorAll("#forms-editor [data-form-row]");
  const out = [];
  for(const r of rows){
    const name = r.querySelector("[data-form-name]").value.trim();
    if(!name) continue;
    const type = r.querySelector("[data-form-type]").value;
    const fileInput = r.querySelector("[data-form-file]");
    let dataUrl = r.querySelector("[data-form-dataurl]").value || "";
    if(fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      if(file.size > 1.5*1024*1024){ toast(t('fileTooBig'), false); }
      else { dataUrl = await readFileAsDataURL(file); }
    }
    out.push({name, type, dataUrl});
  }
  return out;
}

async function saveSop(existingId){
  const titleEn = document.getElementById("f-title-en").value.trim();
  const code = document.getElementById("f-code").value.trim();
  if(!titleEn || !code){ toast(t('fieldRequired'), false); return; }
  const orig = existingId ? getSop(existingId) : null;
  const relatedForms = await collectAttachments();
  const payload = {
    id: existingId || code,
    code: code,
    dept: document.getElementById("f-dept").value,
    category: document.getElementById("f-cat").value,
    title:{en:titleEn, ar:document.getElementById("f-title-ar").value.trim()||titleEn},
    purpose:{en:document.getElementById("f-purpose-en").value.trim(), ar:document.getElementById("f-purpose-ar").value.trim()},
    scope:{en:document.getElementById("f-scope-en").value.trim(), ar:document.getElementById("f-scope-ar").value.trim()},
    version: document.getElementById("f-version").value.trim() || "1.0",
    effectiveDate: document.getElementById("f-eff").value,
    lastUpdated: document.getElementById("f-upd").value,
    responsiblePerson: document.getElementById("f-resp").value.trim(),
    status: document.getElementById("f-status").value,
    responsibilities: orig ? orig.responsibilities : [],
    requiredDocs: document.getElementById("f-docs").value.split("\n").map(x=>x.trim()).filter(Boolean),
    procedure: document.getElementById("f-procedure").value.split("\n").map(x=>x.trim()).filter(Boolean),
    approvalWorkflow: orig ? orig.approvalWorkflow : [],
    relatedForms: relatedForms,
    relatedSops: orig ? orig.relatedSops : [],
    versionHistory: orig ? orig.versionHistory.concat(orig.version!==document.getElementById("f-version").value.trim() ? [{version:document.getElementById("f-version").value.trim(), date:document.getElementById("f-upd").value, change:"Updated via Admin Panel", updatedBy: ROLE}] : []) : [{version:document.getElementById("f-version").value.trim()||"1.0", date:document.getElementById("f-eff").value, change:"Initial release", updatedBy: ROLE}],
    keywords: orig ? orig.keywords : []
  };
  const trialSops = existingId ? SOPS.map(x=> x.id===existingId ? payload : x) : SOPS.concat([payload]);
  const approxSize = JSON.stringify({departments:DEPARTMENTS, sops:trialSops}).length;
  if(approxSize > 4.5*1024*1024){ toast(t('fileTooBig'), false); return; }
  if(existingId){
    const idx = SOPS.findIndex(x=>x.id===existingId);
    SOPS[idx] = payload;
  } else {
    SOPS.push(payload);
  }
  await persistData(false);
  closeModal();
  toast(existingId ? t('updated') : t('added'), true);
  renderShell();
  if(parseRoute()[0]==='admin') renderAdmin("sops"); else route();
}

/* ---------------------------- SHELL + INIT ---------------------------- */
function renderShell(){
  document.documentElement.setAttribute("dir", dir());
  document.documentElement.setAttribute("lang", LANG);
  renderSidebar();
  renderTopbar();
}

async function init(){
  await loadAll();
  renderShell();
  route();
}
init();
